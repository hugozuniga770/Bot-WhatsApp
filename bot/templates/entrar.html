{% extends "base.html" %}
{% block titulo %}Entrar · Bots de WhatsApp{% endblock %}
{% block barra %}{% endblock %}
{% block contenido %}
<div class="entrar">
  <h1>Bots de WhatsApp</h1>
  <p class="suave">Panel de administración.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    {% if error %}<p class="error-campo">{{ error }}</p>{% endif %}
    <div class="acciones"><button class="boton principal" type="submit">Entrar</button></div>
  </form>
</div>
{% endblock %}
