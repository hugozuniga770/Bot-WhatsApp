# Blueprint de Render: describe el servicio para que Render lo cree solo desde GitHub.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bots-whatsapp
    runtime: python
    plan: free                    # D-02: gratis; se duerme tras 15 min sin mensajes
    branch: main
    autoDeployTrigger: checksPass # D-09: despliega solo si el CI de GitHub pasa en verde
    buildCommand: pip install -r requirements.txt
    # D-07: un solo proceso con 4 hilos (los candados por chat viven en memoria del proceso)
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT "bot.app:crear_app()"
    healthCheckPath: /salud
    envVars:
      # sync: false = Render te pide el valor en el panel; nunca se escribe aquí.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Render la genera sola (256 bits al azar). Cópiala a un lugar seguro: si cambia,
      # las llaves guardadas de las empresas ya no se pueden leer (D-14).
      - key: CLAVE_MAESTRA
        generateValue: true
      - key: ZONA_HORARIA
        value: America/La_Paz
      - key: GRAPH_VERSION
        value: v23.0
