# Blueprint de Render: describe el servicio para que Render lo cree solo desde GitHub.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bot-whatsapp-mama
    runtime: python
    plan: free                    # D-02: gratis; se duerme tras 15 min sin mensajes
    branch: main
    autoDeployTrigger: checksPass # D-09: despliega solo si el CI de GitHub pasa en verde
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT "bot.app:crear_app()"
    healthCheckPath: /
    envVars:
      # sync: false = Render te pide el valor en el panel; nunca se escribe aquí.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DUENA_NUMERO
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: GRAPH_VERSION
        value: v23.0
      - key: PAUSA_HORAS
        value: "12"
