name: CI - pruebas del bot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Postgres temporal solo para los tests de AlmacenPostgres (BOT-RF-11).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obtener la version del repositorio
        uses: actions/checkout@v6

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Registrar entorno y version comprobada
        run: |
          python --version
          git rev-parse HEAD

      - name: Instalar dependencias declaradas
        run: python -m pip install -r requirements.txt

      - name: Comprobar que el servicio arranca (sin base ni llaves reales)
        env:
          CLAVE_MAESTRA: clave-maestra-solo-para-el-ci
          ADMIN_PASSWORD: contrasena-solo-para-el-ci
        run: python -c "from bot.app import crear_app; crear_app(); print('El servicio arranca')"

      - name: Ejecutar las pruebas (incluye PostgreSQL real)
        env:
          TEST_DATABASE_URL: postgresql://bot:bot@localhost:5432/bot_test
        run: python -m pytest -v -rs --junitxml=evidencias/junit.xml

      - name: Verificar que no se salto ninguna prueba
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          raiz = ET.parse("evidencias/junit.xml").getroot()
          suite = raiz.find("testsuite") if raiz.tag == "testsuites" else raiz
          saltadas = int(suite.get("skipped", 0))
          print(f"Pruebas: {suite.get('tests')} | saltadas: {saltadas}")
          raise SystemExit(1 if saltadas else 0)
          PY

      - name: Conservar el resultado de las pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/junit.xml
          if-no-files-found: warn
          retention-days: 14
